<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nilai Siswa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; background:#f4f6f8; margin:0 }
header { background:#1e88e5; color:white; padding:20px; text-align:center }
.container { padding:20px }
input, select, button {
  width:100%; padding:10px; margin-top:10px;
  border-radius:6px; border:1px solid #ccc
}
button { background:#1e88e5; color:white; border:none }
.card {
  background:white; padding:15px; margin-top:15px; border-radius:8px
}
.mapel { font-weight:bold }
.avg { margin-top:6px; color:#1e88e5; font-weight:bold }
</style>
</head>

<body>

<header>
<h2>📊 Nilai Siswa</h2>
<a href="index.html" style="color:white">← Kembali</a>
</header>

<div class="container">
  <select id="kelas">
    <option value="A">Kelas VI A</option>
    <option value="B">Kelas VI B</option>
  </select>

  <input id="kode" placeholder="Masukkan Kode Orang Tua">
  <button onclick="cek()">Lihat Nilai</button>

  <select id="filterMapel" onchange="tampil()" style="display:none"></select>

  <div id="hasil"></div>
</div>

<script>
let semuaData = [];

// Fungsi parsing tanggal: bersihkan kutip, lalu kenali format
function parseTanggal(tgl) {
  // Hapus tanda kutip tunggal/ganda
  let cleaned = tgl.replace(/['"]/g, '').trim();
  
  // Format yyyy-mm-dd
  if (cleaned.includes('-')) {
    return new Date(cleaned);
  }
  
  // Format m/d/yyyy atau m/d/yy
  const p = cleaned.split("/");
  if (p.length === 3) {
    let m = p[0].padStart(2,"0");
    let d = p[1].padStart(2,"0");
    let y = p[2].length === 2 ? "20"+p[2] : p[2];
    return new Date(`${y}-${m}-${d}`);
  }
  
  return new Date(cleaned); // fallback
}

// Fungsi pemecah baris CSV yang menghormati tanda kutip ganda
function parseCSVLine(line, delimiter) {
  const result = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === delimiter && !inQuotes) {
      result.push(current.trim());
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current.trim());
  return result;
}

async function cek() {
  const kode = document.getElementById("kode").value.trim();
  const kelas = document.getElementById("kelas").value;
  const res = await fetch(`data/nilai_kelas${kelas}.csv`);
  const text = await res.text();

  // Ambil baris, abaikan kosong
  const lines = text.split('\n').filter(line => line.trim() !== '');
  if (lines.length === 0) {
    document.getElementById("hasil").innerHTML = "<p>File kosong</p>";
    return;
  }

  // Deteksi delimiter dari header
  const headerLine = lines[0];
  const commaCount = (headerLine.match(/,/g) || []).length;
  const semicolonCount = (headerLine.match(/;/g) || []).length;
  const delimiter = commaCount >= semicolonCount ? ',' : ';';

  semuaData = [];
  
  // Mulai dari baris ke-1 (skip header)
  for (let i = 1; i < lines.length; i++) {
    const r = lines[i].trim();
    if (!r) continue;

    const col = parseCSVLine(r, delimiter);
    if (col.length < 5) continue;

    const [k, nama, mapel, tanggal, nilaiStr] = col;

    if (k === kode) {
      const dateObj = parseTanggal(tanggal);
      // Abaikan tanggal yang tidak valid
      if (isNaN(dateObj.getTime())) continue;

      const nilai = Number(nilaiStr) || 0; // jika kosong anggap 0

      semuaData.push({
        nama,
        mapelAsli: mapel,
        mapel: mapel.replace(/\s*\(.*?\)/g,""), // ambil nama mapel tanpa keterangan
        tanggal,
        nilai,
        dateObj
      });
    }
  }

  if (semuaData.length === 0) {
    document.getElementById("hasil").innerHTML = "<p>Data tidak ditemukan</p>";
    document.getElementById("filterMapel").style.display = "none";
    return;
  }

  // Urutkan data terbaru
  semuaData.sort((a,b) => b.dateObj - a.dateObj);

  // Isi dropdown mapel
  const select = document.getElementById("filterMapel");
  select.innerHTML = `<option value="all">Semua Mapel</option>`;
  [...new Set(semuaData.map(d => d.mapel))].forEach(m => {
    select.innerHTML += `<option value="${m}">${m}</option>`;
  });
  select.style.display = "block";
  
  tampil();
}

function tampil() {
  const pilih = document.getElementById("filterMapel").value;
  const hasil = document.getElementById("hasil");
  hasil.innerHTML = "";

  const data = pilih === "all"
    ? semuaData
    : semuaData.filter(d => d.mapel === pilih);

  if (data.length === 0) {
    hasil.innerHTML = "<p>Tidak ada data untuk mapel ini</p>";
    return;
  }

  hasil.innerHTML += `<div class="card"><b>${data[0].nama}</b></div>`;

  // Kelompokkan per mapel (nama dasar)
  let grup = {};
  data.forEach(d => {
    if (!grup[d.mapel]) grup[d.mapel] = [];
    grup[d.mapel].push(d);
  });

  // Tampilkan per mapel
  for (let m in grup) {
    let total = 0;
    grup[m].forEach(i => total += i.nilai);
    let rata = (total / grup[m].length).toFixed(1);

    let html = `<div class="card"><div class="mapel">${m}</div>`;
    grup[m].forEach(i => {
      html += `${i.tanggal} — ${i.mapelAsli} : <b>${i.nilai}</b><br>`;
    });
    html += `<div class="avg">Rata-rata: ${rata}</div></div>`;
    hasil.innerHTML += html;
  }
}
</script>

</body>
</html>
