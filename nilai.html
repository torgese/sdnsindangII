<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nilai Siswa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background:#f4f6f8; margin:0 }
header { background:#1e88e5; color:white; padding:20px; text-align:center }
.container { padding:20px }
input, select, button {
  width:100%; padding:10px; margin-top:10px;
  border-radius:6px; border:1px solid #ccc;
  box-sizing: border-box;
}
button { background:#1e88e5; color:white; border:none; cursor:pointer }
button:hover { background:#1565c0 }
.card {
  background:white; padding:15px; margin-top:15px; border-radius:8px
}
.mapel { font-weight:bold }
.avg { margin-top:6px; color:#1e88e5; font-weight:bold }
.debug { background:#f0f0f0; padding:10px; font-size:12px; margin-top:10px; border-radius:6px; color:#555 }
</style>
</head>
<body>

<header>
<h2>📊 Nilai Siswa</h2>
<a href="index.html" style="color:white">← Kembali</a>
</header>

<div class="container">
  <select id="kelas">
    <option value="A">Kelas VI A</option>
    <option value="B">Kelas VI B</option>
  </select>

  <select id="jenis">
    <option value="harian">Nilai Harian</option>
    <option value="praktik">Nilai Ujian Praktik</option>
    <option value="uas" selected>Ujian Akhir Sekolah (UAS)</option>
    <option value="uaj">Ujian Akhir Jenjang (UAJ)</option>
  </select>

  <input id="kode" placeholder="Masukkan Kode Orang Tua (contoh: A1.3195550441)">
  <button onclick="cek()">Lihat Nilai</button>

  <select id="filterMapel" onchange="tampil()" style="display:none"></select>
  <div id="hasil"></div>
  <div id="debug" class="debug" style="display:none"></div>
</div>

<script>
let semuaData = [];
let jenisSaatIni = '';

// Bersihkan teks dari karakter tersembunyi (termasuk non-breaking space)
function bersihkanTeks(str) {
  if (!str) return '';
  // Ganti non-breaking space dengan spasi biasa, lalu trim
  return str.replace(/\u00A0/g, ' ').trim();
}

// Parse tanggal (tidak terlalu dipakai untuk UAS)
function parseTanggal(tgl) {
  if (!tgl) return null;
  let cleaned = bersihkanTeks(tgl);
  if (!cleaned) return null;
  if (cleaned.includes('-')) return new Date(cleaned);
  let p = cleaned.split("/");
  if (p.length === 3) {
    let m = p[0].padStart(2,"0");
    let d = p[1].padStart(2,"0");
    let y = p[2].length === 2 ? "20"+p[2] : p[2];
    return new Date(`${y}-${m}-${d}`);
  }
  return new Date(cleaned);
}

// Parser CSV yang kuat: membersihkan spasi di setiap kolom
function parseCSVLine(line, delimiter) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    let char = line[i];
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === delimiter && !inQuotes) {
      result.push(bersihkanTeks(current));
      current = '';
    } else {
      current += char;
    }
  }
  result.push(bersihkanTeks(current));
  return result;
}

// Coba fetch dari beberapa path (data/ atau root)
async function fetchCSV(fileName) {
  const paths = [`data/${fileName}`, fileName];
  for (let path of paths) {
    try {
      const res = await fetch(path);
      if (res.ok) {
        const text = await res.text();
        console.log(`✅ Loaded from: ${path}`);
        return text;
      }
    } catch(e) { console.log(`❌ Gagal load ${path}`); }
  }
  throw new Error(`File ${fileName} tidak ditemukan di data/ maupun root.`);
}

async function cek() {
  const kodeInput = document.getElementById("kode").value.trim();
  const kelas = document.getElementById("kelas").value;
  const jenis = document.getElementById("jenis").value;
  jenisSaatIni = jenis;

  if (!kodeInput) {
    alert("Masukkan kode orang tua terlebih dahulu");
    return;
  }

  let namaFile;
  switch (jenis) {
    case 'harian': namaFile = `nilai_harian_kelas${kelas}.csv`; break;
    case 'praktik': namaFile = `nilai_praktik_kelas${kelas}.csv`; break;
    case 'uas': namaFile = `nilai_akhir_sekolah_kelas${kelas}.csv`; break;
    case 'uaj': namaFile = `nilai_akhir_jenjang_kelas${kelas}.csv`; break;
    default: return;
  }

  try {
    const text = await fetchCSV(namaFile);
    const lines = text.split(/\r?\n/).filter(l => bersihkanTeks(l).length > 0);
    if (lines.length < 2) throw new Error("File kosong");

    // Deteksi delimiter (koma atau titik koma)
    const headerLine = lines[0];
    const commaCount = (headerLine.match(/,/g) || []).length;
    const semicolonCount = (headerLine.match(/;/g) || []).length;
    const delimiter = commaCount >= semicolonCount ? ',' : ';';

    semuaData = [];
    let totalBarisValid = 0;

    for (let i = 1; i < lines.length; i++) {
      const rawLine = lines[i];
      const col = parseCSVLine(rawLine, delimiter);
      if (col.length < 4) continue;

      let kode, nama, mapel, tanggal, nilaiStr;
      if (col.length >= 5) {
        [kode, nama, mapel, tanggal, nilaiStr] = col;
      } else {
        [kode, nama, mapel, nilaiStr] = col;
        tanggal = null;
      }

      // Bersihkan kode dari karakter aneh (non-breaking space dll)
      const kodeBersih = bersihkanTeks(kode);
      if (kodeBersih !== kodeInput) continue; // tidak cocok

      const nilai = Number(nilaiStr);
      if (isNaN(nilai)) continue;

      // Bersihkan nama mapel (hilangkan keterangan dalam kurung)
      const mapelAsli = mapel;
      const mapelBersih = mapelAsli.replace(/\s*\(.*?\)/g, "").trim();

      semuaData.push({
        nama: bersihkanTeks(nama),
        mapelAsli: mapelAsli,
        mapel: mapelBersih,
        tanggal: tanggal ? bersihkanTeks(tanggal) : '',
        nilai: nilai,
        dateObj: parseTanggal(tanggal)
      });
      totalBarisValid++;
    }

    // Debug info
    const debugDiv = document.getElementById("debug");
    if (semuaData.length === 0) {
      debugDiv.style.display = "block";
      debugDiv.innerHTML = `⚠️ Tidak ada data untuk kode "${kodeInput}". Pastikan kode sesuai (contoh: A1.3195550441). Total baris di CSV: ${lines.length-1}, ditemukan baris valid: ${totalBarisValid}`;
      document.getElementById("hasil").innerHTML = "<p>Data tidak ditemukan</p>";
      document.getElementById("filterMapel").style.display = "none";
      return;
    } else {
      debugDiv.style.display = "none";
    }

    // Urutkan (jika ada tanggal, urut berdasarkan tanggal terbaru)
    const adaTanggal = semuaData.some(d => d.dateObj !== null);
    if (adaTanggal) {
      semuaData.sort((a,b) => (b.dateObj||0) - (a.dateObj||0));
    } else {
      semuaData.sort((a,b) => a.mapel.localeCompare(b.mapel));
    }

    // Populate dropdown mapel
    const select = document.getElementById("filterMapel");
    const mapelUnik = [...new Set(semuaData.map(d => d.mapel))];
    select.innerHTML = `<option value="all">Semua Mapel (${mapelUnik.length})</option>`;
    mapelUnik.forEach(m => {
      select.innerHTML += `<option value="${m}">${m}</option>`;
    });
    select.style.display = "block";

    tampil();
  } catch (err) {
    console.error(err);
    document.getElementById("hasil").innerHTML = `<p>Error: ${err.message}</p>`;
    document.getElementById("filterMapel").style.display = "none";
  }
}

function tampil() {
  const pilih = document.getElementById("filterMapel").value;
  const hasil = document.getElementById("hasil");
  hasil.innerHTML = "";

  let data = pilih === "all"
    ? semuaData
    : semuaData.filter(d => d.mapel === pilih);

  if (data.length === 0) {
    hasil.innerHTML = "<p>Tidak ada data untuk mapel ini</p>";
    return;
  }

  // Tampilkan nama siswa
  hasil.innerHTML += `<div class="card"><b>📌 ${data[0].nama}</b></div>`;

  // Kelompokkan per mapel
  let grup = {};
  data.forEach(d => {
    if (!grup[d.mapel]) grup[d.mapel] = [];
    grup[d.mapel].push(d);
  });

  for (let m in grup) {
    let total = 0;
    grup[m].forEach(i => total += i.nilai);
    let rata = (total / grup[m].length).toFixed(1);

    let html = `<div class="card"><div class="mapel">📖 ${m}</div>`;
    grup[m].forEach(i => {
      if (i.tanggal) {
        html += `${i.tanggal} — ${i.mapelAsli} : <b>${i.nilai}</b><br>`;
      } else {
        html += `${i.mapelAsli} : <b>${i.nilai}</b><br>`;
      }
    });
    html += `<div class="avg">⭐ Rata-rata: ${rata}</div></div>`;
    hasil.innerHTML += html;
  }
}
</script>
</body>
</html>
