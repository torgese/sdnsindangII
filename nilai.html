<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nilai Siswa - Fix Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: Arial; background:#f4f6f8; margin:0 }
  header { background:#1e88e5; color:white; padding:20px; text-align:center }
  .container { padding:20px }
  input, select, button {
    width:100%; padding:10px; margin-top:10px;
    border-radius:6px; border:1px solid #ccc;
    box-sizing: border-box;
  }
  button { background:#1e88e5; color:white; border:none; cursor:pointer }
  button:hover { background:#1565c0 }
  .card {
    background:white; padding:15px; margin-top:15px; border-radius:8px
  }
  .mapel { font-weight:bold }
  .avg { margin-top:6px; color:#1e88e5; font-weight:bold }
  .debug {
    background:#f0f0f0; padding:10px; font-size:12px; margin-top:10px;
    border-radius:6px; color:#555; white-space:pre-wrap; font-family:monospace;
  }
</style>
</head>
<body>

<header>
<h2>📊 Nilai Siswa</h2>
<a href="index.html" style="color:white">← Kembali</a>
</header>

<div class="container">
  <select id="kelas">
    <option value="A">Kelas VI A</option>
    <option value="B">Kelas VI B</option>
  </select>

  <select id="jenis">
    <option value="harian">Nilai Harian</option>
    <option value="praktik">Nilai Ujian Praktik</option>
    <option value="uas" selected>Ujian Akhir Sekolah (UAS)</option>
    <option value="uaj">Ujian Akhir Jenjang (UAJ)</option>
  </select>

  <input id="kode" placeholder="Masukkan Kode Orang Tua (contoh: A2.3142815160)" value="A2.3142815160">
  <button onclick="cek()">Lihat Nilai</button>

  <select id="filterMapel" onchange="tampil()" style="display:none"></select>
  <div id="hasil"></div>
  <div id="debug" class="debug"></div>
</div>

<script>
let semuaData = [];

// Fungsi pembersihan super kuat
function bersihkanSuper(str) {
  if (!str) return '';
  // Hapus karakter non-breaking space, spasi tak terlihat, dan trim
  let bersih = str.replace(/\u00A0/g, ' ')           // non-breaking space
                  .replace(/[\u200B-\u200D\uFEFF]/g, '') // zero-width spaces
                  .replace(/\s+/g, ' ')              // multiple spaces jadi satu
                  .trim();
  return bersih;
}

// Parse nilai: coba Number, jika gagal ambil angka pertama dari string
function parseNilai(str) {
  let cleaned = bersihkanSuper(str);
  let num = Number(cleaned);
  if (!isNaN(num)) return num;
  // coba ekstrak angka menggunakan regex
  let match = cleaned.match(/\d+/);
  if (match) return parseInt(match[0], 10);
  return NaN;
}

// Parse CSV line yang andal
function parseCSVLine(line, delimiter) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    let ch = line[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === delimiter && !inQuotes) {
      result.push(bersihkanSuper(current));
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(bersihkanSuper(current));
  return result;
}

// Fetch dengan fallback path
async function fetchCSV(fileName) {
  const paths = [`data/${fileName}`, fileName];
  for (let path of paths) {
    try {
      const res = await fetch(path);
      if (res.ok) {
        const text = await res.text();
        console.log(`✅ Loaded: ${path}`);
        return text;
      }
    } catch(e) { console.warn(`Gagal: ${path}`); }
  }
  throw new Error(`File ${fileName} tidak ditemukan`);
}

async function cek() {
  const kodeInput = bersihkanSuper(document.getElementById("kode").value);
  const kelas = document.getElementById("kelas").value;
  const jenis = document.getElementById("jenis").value;
  const debugDiv = document.getElementById("debug");
  
  if (!kodeInput) {
    alert("Masukkan kode");
    return;
  }

  let namaFile;
  switch (jenis) {
    case 'harian': namaFile = `nilai_harian_kelas${kelas}.csv`; break;
    case 'praktik': namaFile = `nilai_praktik_kelas${kelas}.csv`; break;
    case 'uas': namaFile = `nilai_akhir_sekolah_kelas${kelas}.csv`; break;
    case 'uaj': namaFile = `nilai_akhir_jenjang_kelas${kelas}.csv`; break;
    default: return;
  }

  try {
    const text = await fetchCSV(namaFile);
    const lines = text.split(/\r?\n/).filter(l => bersihkanSuper(l).length > 0);
    if (lines.length < 2) throw new Error("File kosong");

    // Deteksi delimiter
    const headerLine = lines[0];
    const commaCount = (headerLine.match(/,/g) || []).length;
    const semicolonCount = (headerLine.match(/;/g) || []).length;
    const delimiter = commaCount >= semicolonCount ? ',' : ';';

    semuaData = [];
    let barisDitemukan = 0;
    let barisGagal = [];
    let barisCocok = 0;

    for (let i = 1; i < lines.length; i++) {
      const raw = lines[i];
      const col = parseCSVLine(raw, delimiter);
      if (col.length < 4) {
        barisGagal.push(`Baris ${i+1}: kolom kurang (${col.length}) - ${raw.substring(0,50)}`);
        continue;
      }

      let kode, nama, mapel, tanggal, nilaiStr;
      if (col.length >= 5) {
        [kode, nama, mapel, tanggal, nilaiStr] = col;
      } else {
        [kode, nama, mapel, nilaiStr] = col;
        tanggal = '';
      }

      // Bersihkan kode
      const kodeBersih = bersihkanSuper(kode);
      if (kodeBersih !== kodeInput) continue;
      barisCocok++;

      const nilai = parseNilai(nilaiStr);
      if (isNaN(nilai)) {
        barisGagal.push(`Baris ${i+1}: nilai tidak valid '${nilaiStr}'`);
        continue;
      }

      const mapelAsli = mapel;
      const mapelBersih = mapelAsli.replace(/\s*\(.*?\)/g, "").trim();

      semuaData.push({
        nama: bersihkanSuper(nama),
        mapelAsli: mapelAsli,
        mapel: mapelBersih,
        tanggal: tanggal ? bersihkanSuper(tanggal) : '',
        nilai: nilai
      });
      barisDitemukan++;
    }

    // Tampilkan debug
    let debugMsg = `🔍 Kode dicari: "${kodeInput}"\n`;
    debugMsg += `📄 Total baris CSV: ${lines.length-1}\n`;
    debugMsg += `✅ Baris dengan kode cocok: ${barisCocok}\n`;
    debugMsg += `📊 Berhasil diproses: ${barisDitemukan}\n`;
    if (barisGagal.length > 0) {
      debugMsg += `⚠️ Gagal (${barisGagal.length}):\n${barisGagal.slice(0,5).join('\n')}`;
    }
    debugDiv.innerText = debugMsg;

    if (semuaData.length === 0) {
      document.getElementById("hasil").innerHTML = "<p>❌ Data tidak ditemukan. Periksa debug di bawah.</p>";
      document.getElementById("filterMapel").style.display = "none";
      return;
    }

    // Urutkan berdasarkan mapel
    semuaData.sort((a,b) => a.mapel.localeCompare(b.mapel));

    // Dropdown mapel
    const selectMapel = document.getElementById("filterMapel");
    const unikMapel = [...new Set(semuaData.map(d => d.mapel))];
    selectMapel.innerHTML = `<option value="all">Semua Mapel (${unikMapel.length})</option>`;
    unikMapel.forEach(m => {
      selectMapel.innerHTML += `<option value="${m}">${m}</option>`;
    });
    selectMapel.style.display = "block";

    tampil();
  } catch (err) {
    debugDiv.innerText = `❌ Error: ${err.message}`;
    console.error(err);
  }
}

function tampil() {
  const pilih = document.getElementById("filterMapel").value;
  const hasil = document.getElementById("hasil");
  hasil.innerHTML = "";

  let data = pilih === "all" ? semuaData : semuaData.filter(d => d.mapel === pilih);
  if (data.length === 0) {
    hasil.innerHTML = "<p>Tidak ada data untuk mapel ini</p>";
    return;
  }

  hasil.innerHTML += `<div class="card"><b>👤 ${data[0].nama}</b></div>`;

  const grup = {};
  data.forEach(d => {
    if (!grup[d.mapel]) grup[d.mapel] = [];
    grup[d.mapel].push(d);
  });

  for (let m in grup) {
    let total = 0;
    grup[m].forEach(i => total += i.nilai);
    let rata = (total / grup[m].length).toFixed(1);
    let html = `<div class="card"><div class="mapel">📘 ${m}</div>`;
    grup[m].forEach(i => {
      if (i.tanggal) html += `${i.tanggal} — `;
      html += `${i.mapelAsli} : <b>${i.nilai}</b><br>`;
    });
    html += `<div class="avg">⭐ Rata-rata: ${rata}</div></div>`;
    hasil.innerHTML += html;
  }
}
</script>
</body>
</html>
